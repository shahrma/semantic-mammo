training:
  num_workers: 8
  warmup_epochs: 10
  num_epochs: 200
  batch_size: 8
  optimizer_type: 'Adam'
  learning_rate: 0.00001
  weight_decay: 0.0005
  momentum: 0.9
  scheduler_type: MultiStepLR
  MultiStepLR:
    milestones: [60, 120, 160]
    gamma: 0.2
#  routing_criterion:
#    criterion_type: null
#    lambda_last_epoch: 30
#    lambda_step: 5
#    lambda_balance: 5
  criteria:
    main:
      type: CrossEntropyLoss
      weight: 1
#    mass_margins: BCEWithLogitsLoss
#    density_score: BCEWithLogitsLoss
#    mass_shape_standard: BCEWithLogitsLoss


model:
  model_source: o
  model_type: wrapped_convnext_base
  model_weights: IMAGENET1K_V1
  model_args: null
  in_channels: 3
  use_pretrained: True
  replacing_list:
    abnormality type:
      layers:
        - 'features.5.1.*'
        - 'features.5.2.*'
        - 'features.5.3.*'
      params:
        init_type: 'biased'
        active_mode: 'mlp'
    breast density:
      layers:
        - 'features.5.6.*'
        - 'features.5.7.*'
        - 'features.5.8.*'
      params:
        init_type: 'biased'
        active_mode: 'mlp'
    mass shape:
      layers:
        - 'features.5.9.*'
        - 'features.5.10.*'
        - 'features.5.11.*'
      params:
        init_type: 'biased'
        active_mode: 'mlp'
    mass margins:
      layers:
        - 'features.5.14.*'
        - 'features.5.15.*'
        - 'features.5.16.*'
      params:
        init_type: 'biased'
        active_mode: 'mlp'
    calc morphology:
      layers:
        - 'features.5.19.*'
        - 'features.5.20.*'
        - 'features.5.21.*'
      params:
        init_type: 'biased'
        active_mode: 'mlp'
    calc distribution:
      layers:
        - 'features.5.24.*'
        - 'features.5.25.*'
        - 'features.5.26.*'
      params:
        init_type: 'biased'
        active_mode: 'mlp'